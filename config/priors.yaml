# Per-class 3D priors used to turn a 2D detection into a metric cuboid.
#
# dims      : [width, height, length] in metres (Omni3D convention)
# height    : real-world height in metres, used by the "prior" depth estimator
#             (Z = f * height / pixel_height)
# grounded  : true  -> the object rests on the ground, the depth is sampled
#                       from the lower part of the 2D box
#             false -> the object is suspended (ball, backpack, ...), the depth
#                       is sampled from the centre of the 2D box
# weight    : prior weight used by the subject scorer (higher = more likely to
#             be the main subject of the frame)
#
# Values are rough population averages; they are the dominant source of the
# residual size error (10-20%).

default:
  dims: [0.60, 0.60, 0.60]
  height: 0.60
  grounded: false
  weight: 0.1

