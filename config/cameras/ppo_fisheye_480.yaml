# Equidistant fisheye surround rig (4 cameras, 480x480).
#
# SOURCE: converted from
#   D:\Desktop\chat\opencode\project\ppo\vendor\camera_config.npz
# which was generated by ppo/scripts/make_camera_config.py with its DEFAULT
# arguments (--focal 220 --size 480 --distortion 0.02 -0.005 0.0005 0).
#
# !! WARNING: these are SYNTHETIC PLACEHOLDER values, not a real calibration.
#    The generator script says so explicitly:
#       "For a real rig, replace K and D with the values obtained from
#        cv2.fisheye.calibrate."
#    Run scripts/calibrate_fisheye.py to replace them with measured values.
#
# Lens model: equidistant (theta_d = theta * (1 + k1 t^2 + k2 t^4 + k3 t^6 + k4 t^8)),
# identical to ppo/panorama/geometry/fisheye.py.

default_yaw: 0.0

cameras:
  - name: cam0_front
    yaw: 0.0
    pitch: 0.0
    model: equidistant_fisheye
    width: 480
    height: 480
    fx: 220.0
    fy: 220.0
    cx: 240.0
    cy: 240.0
    distortion: [0.02, -0.005, 0.0005, 0.0]

  - name: cam1_right
    yaw: 90.0
    pitch: 0.0
    model: equidistant_fisheye
    width: 480
    height: 480
    fx: 220.0
    fy: 220.0
    cx: 240.0
    cy: 240.0
    distortion: [0.02, -0.005, 0.0005, 0.0]

  - name: cam2_rear
    yaw: 180.0
    pitch: 0.0
    model: equidistant_fisheye
    width: 480
    height: 480
    fx: 220.0
    fy: 220.0
    cx: 240.0
    cy: 240.0
    distortion: [0.02, -0.005, 0.0005, 0.0]

  - name: cam3_left
    yaw: 270.0
    pitch: 0.0
    model: equidistant_fisheye
    width: 480
    height: 480
    fx: 220.0
    fy: 220.0
    cx: 240.0
    cy: 240.0
    distortion: [0.02, -0.005, 0.0005, 0.0]
